name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Unit + contracts
        run: npm test

  phase1-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Start stack
        run: docker compose up -d
      - name: Wait for postgres
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U osf -d osf_phase1 && break
            sleep 2
          done
      - name: Wait for redpanda
        run: |
          for i in $(seq 1 40); do
            docker compose exec -T redpanda rpk cluster health 2>/dev/null | grep -q Healthy && break
            sleep 3
          done
      - name: Ensure topics
        run: npm run dev:topic
      - name: Start consumer
        run: npm run consumer &
      - name: Start ingress
        run: npm run ingress &
      - name: Wait ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4100/health && break
            sleep 1
          done
      - name: Phase 1 smoke
        run: npm run phase1:smoke
      - name: Tear down
        if: always()
        run: docker compose down -v
